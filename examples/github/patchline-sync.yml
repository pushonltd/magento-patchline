# Copy to .github/workflows/patchline-sync.yml in your store repository.
#
# Opens a pull request whenever Adobe's registry has new isolated patches for your store.
# Nothing is merged automatically: review the PR, let your pipeline run, then merge.
name: Patchline sync

on:
  schedule:
    # Adobe publishes isolated patches on the second Tuesday of the month. A cron entry that
    # restricts both day-of-month and day-of-week (for example "0 18 8-14 * 2") runs when EITHER
    # matches, so it would fire on every Tuesday and on days 8-14. We therefore run every
    # Tuesday: the job is cheap and opens a PR only when there is something new.
    - cron: "0 18 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: patchline-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Adobe patches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the patchline/sync branch with the new m2-hotfixes files
      pull-requests: write # open or update the pull request
    steps:
      - name: Check out the store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is handed to the pull request step only, via GH_TOKEN

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        env:
          # Only needed for Commerce / entitled patches or a private repo.magento.com mirror.
          # Remove this line for Magento Open Source without a private mirror.
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-scripts --no-interaction --prefer-dist

      - name: Download missing patches
        run: vendor/bin/patchline sync --adopt --prune --format=github

      - name: Verify that the patch queue applies
        run: vendor/bin/patchline verify

      - name: Write the pull request description
        run: |
          {
            echo "Patchline found new or changed Adobe patches for this store."
            echo
            echo '```'
            vendor/bin/patchline status --no-ansi || true
            echo '```'
          } > "$RUNNER_TEMP/patchline-pr-body.md"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the only step that receives a write token
          BRANCH: patchline/sync
          TITLE: "chore(patches): sync Adobe security patches"
        run: |
          if [ -z "$(git status --porcelain -- m2-hotfixes)" ]; then
            echo "No patch changes; nothing to open."
            exit 0
          fi
          gh auth setup-git # git pushes with GH_TOKEN for this step only; nothing is stored in .git/config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- m2-hotfixes
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/patchline-pr-body.md"
          else
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/patchline-pr-body.md"
          fi

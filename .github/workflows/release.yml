name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the tagged commit
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2" # lowest supported PHP; the PHAR is resolved for it
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install Box
        run: composer update --working-dir=tools/box --no-interaction --no-progress --prefer-dist

      - name: Build dist/patchline.phar
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: composer build -- --version="$RELEASE_TAG"

      - name: Run the CLI suite against the PHAR
        env:
          PATCHLINE_BIN: dist/patchline.phar
        run: composer test:cli:phar

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # sign the provenance attestation with the workflow identity
      attestations: write # store the provenance attestation
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/patchline.phar

      # The gh CLI (preinstalled on the runner) replaces a third-party release action: one less dependency to trust.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/patchline.phar dist/patchline.phar.sha256
          --verify-tag --title "$RELEASE_TAG" --generate-notes

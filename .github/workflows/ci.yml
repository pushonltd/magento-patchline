name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Find the Composer download directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-lint-${{ hashFiles('composer.json') }}
          restore-keys: composer-lint-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Check the coding standard
        run: composer cs

      - name: Run static analysis
        run: composer analyse

  test:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }}${{ matrix.dependencies == 'lowest' && ', lowest' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]
        include:
          - os: macos-latest
            php: "8.5"
          - os: ubuntu-latest
            php: "8.2"
            dependencies: lowest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Find the Composer download directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.dependencies || 'latest' }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.dependencies || 'latest' }}-

      - name: Install dependencies
        env:
          COMPOSER_FLAGS: ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
        # COMPOSER_FLAGS is intentionally unquoted: it is empty or a single option
        run: composer update --no-interaction --no-progress --prefer-dist $COMPOSER_FLAGS

      - name: Run the tests
        if: ${{ matrix.dependencies != 'lowest' }}
        run: composer test

      # Old vendor libraries raise deprecations of their own; PHPUnit 10.5 can only ignore them via this config.
      - name: Run the tests with vendor deprecations restricted (prefer-lowest)
        if: ${{ matrix.dependencies == 'lowest' }}
        run: vendor/bin/phpunit -c phpunit.prefer-lowest.xml.dist

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: pcov
          tools: composer:v2

      - name: Find the Composer download directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run the tests with the 95 percent line coverage gate
        run: composer test:coverage

      - name: Print the coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Coverage'
            php tools/coverage-check.php build/coverage/clover.xml 95 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: pcov
          tools: composer:v2

      - name: Find the Composer download directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-mutation-${{ hashFiles('composer.json', 'tools/infection/composer.json') }}
          restore-keys: composer-mutation-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Infection
        run: composer update --working-dir=tools/infection --no-interaction --no-progress --prefer-dist

      - name: Run Infection with the MSI gates
        run: composer mutation

      - name: Upload the Infection log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection
          path: build/infection/infection.log
          if-no-files-found: ignore

  build:
    name: PHAR build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PHAR is resolved for PHP 8.2, the lowest supported version, and tested on 8.2 and 8.5 below.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Find the Composer download directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-build-${{ hashFiles('composer.json', 'tools/box/composer.json') }}
          restore-keys: composer-build-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install Box
        run: composer update --working-dir=tools/box --no-interaction --no-progress --prefer-dist

      - name: Build dist/patchline.phar
        run: composer build

      - name: Run the CLI suite against the PHAR
        env:
          PATCHLINE_BIN: dist/patchline.phar
        run: composer test:cli

      - name: Run the PHAR build tests
        run: vendor/bin/phpunit -c tests/Build/phpunit.xml

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  phar:
    name: PHAR on PHP ${{ matrix.php }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run the CLI suite against the PHAR
        env:
          PATCHLINE_BIN: dist/patchline.phar
        run: composer test:cli

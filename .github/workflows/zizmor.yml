name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**.yml"
      - ".github/**.yaml"
  pull_request:
    paths:
      - ".github/**.yml"
      - ".github/**.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository to read the workflow files
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          inputs: .github/
          advanced-security: false # a finding fails the job instead of being uploaded as a code scanning alert
          annotations: true
